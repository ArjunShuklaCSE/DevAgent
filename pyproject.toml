[project]
name = "devagent"
version = "0.1.0"
description = "Autonomous GitHub issue solver: localize, reproduce, fix, validate in a sandbox, open a draft PR after human approval."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "redis>=5.0",
    "arq>=0.26",
    "structlog>=24.1",
    "alembic>=1.13",
    "docker>=7.1",
    "defusedxml>=0.7",
    "pyyaml>=6",
    "requests>=2.34.2",
    "ripgrep==14.1.0",
    "httpx>=0.27",
    "cryptography>=43",
]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.3",
    "httpx>=0.27",
    "import-linter>=2.1",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "types-defusedxml>=0.7.0.20260504",
    "types-docker>=7.2.0.20260923",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
devagent = "evaluation.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "core",
    "workspace",
    "backend",
    "agent",
    "tools",
    "sandbox",
    "llm",
    "evaluation",
    "database",
    "mcp_server",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["frontend", "sample_repos", "evaluation/datasets"]
# Apply the excludes even when files are passed explicitly (pre-commit does that);
# sample repos contain deliberate bugs and must stay byte-for-byte as written.
force-exclude = true

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "BLE", "A", "C4", "SIM",
    "RUF", "PT", "TRY", "ASYNC", "ANN", "PL", "PTH", "LOG", "G",
]
ignore = [
    "TRY003",  # long messages in exception constructors are fine for explicit error types
    "PLR0913", # DI-heavy constructors legitimately take many arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004", "S105", "S106", "S108", "S603", "S607"]
"database/migrations/versions/**" = ["E501"]  # generated CHECK constraint strings

[tool.ruff.lint.isort]
# The repo has a docker/ directory of Dockerfiles; the `docker` import is the SDK.
known-third-party = ["docker"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]
files = [
    "core", "workspace", "backend", "agent", "tools", "sandbox", "llm",
    "evaluation", "database", "mcp_server", "tests",
]
# Hidden tests are fixture code for the sample repositories, like sample_repos/.
exclude = ["^evaluation/datasets/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not integration"]
markers = [
    "integration: needs running Postgres/Redis/Docker (docker compose up); excluded by default",
    "security: security-control tests",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------- import-linter
# Enforces the dependency rule from the spec (Section 4.2) in CI.
[tool.importlinter]
root_packages = [
    "core", "workspace",
    "backend", "agent", "tools", "sandbox", "llm",
    "evaluation", "database", "mcp_server",
]

[[tool.importlinter.contracts]]
name = "Leaf layers (tools, sandbox, llm, workspace) do not import backend or agent"
type = "forbidden"
source_modules = ["tools", "sandbox", "llm", "workspace"]
forbidden_modules = ["backend", "agent"]

[[tool.importlinter.contracts]]
name = "Agent does not depend on the web layer"
type = "forbidden"
source_modules = ["agent"]
forbidden_modules = ["backend"]

[[tool.importlinter.contracts]]
name = "Core domain kernel imports no other DevAgent package"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["backend", "agent", "tools", "sandbox", "llm", "evaluation", "database", "mcp_server", "workspace"]

[[tool.importlinter.contracts]]
name = "Database models do not import application layers"
type = "forbidden"
source_modules = ["database"]
forbidden_modules = ["backend", "agent", "tools", "sandbox", "llm", "evaluation", "mcp_server"]

[[tool.importlinter.contracts]]
name = "Evaluation read models (served by the API) do not import the web layer or the agent"
type = "forbidden"
source_modules = ["evaluation.metrics", "evaluation.stats", "evaluation.report"]
forbidden_modules = ["backend", "agent", "sandbox", "llm", "tools"]
