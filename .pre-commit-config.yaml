# Install: uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: import-linter (dependency rules)
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
      - id: frontend-eslint
        name: eslint
        entry: pnpm --dir frontend lint
        language: system
        files: ^frontend/.*\.(ts|tsx|mjs|js)$
        pass_filenames: false
      - id: frontend-prettier
        name: prettier
        entry: pnpm --dir frontend format:check
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: frontend-typecheck
        name: tsc
        entry: pnpm --dir frontend typecheck
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
