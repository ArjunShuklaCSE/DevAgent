# DevAgent local stack: `docker compose up --build --wait`
#
# `migrate` applies Alembic migrations before `api` and `worker` start.
# `sandbox-image` builds the image agent commands run in. Only `docker-proxy` touches
# the Docker socket; `worker` reaches it over a private network and the proxy only
# lets it run sandbox containers (ADR 0007). Ports are bound to 127.0.0.1.

name: devagent

x-backend-env: &backend-env
  DEVAGENT_ENVIRONMENT: ${DEVAGENT_ENVIRONMENT:-development}
  DEVAGENT_LOG_LEVEL: ${DEVAGENT_LOG_LEVEL:-INFO}
  DEVAGENT_LOG_FORMAT: ${DEVAGENT_LOG_FORMAT:-json}
  DEVAGENT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-devagent}:${POSTGRES_PASSWORD:-devagent}@postgres:5432/${POSTGRES_DB:-devagent}
  DEVAGENT_REDIS_URL: redis://redis:6379/0
  DEVAGENT_CORS_ORIGINS: '["http://localhost:3000"]'

x-backend-build: &backend-build
  context: .
  dockerfile: docker/backend.Dockerfile
  secrets: [extra_ca]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devagent}
      POSTGRES_DB: ${POSTGRES_DB:-devagent}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build: *backend-build
    image: devagent-backend:dev
    command: ["python", "-m", "database.migrate", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: devagent-backend:dev
    environment: *backend-env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  worker:
    image: devagent-backend:dev
    command: ["python", "-m", "backend.worker"]
    environment:
      <<: *backend-env
      DEVAGENT_DOCKER_HOST: tcp://docker-proxy:2375
      DEVAGENT_WORKSPACE_ROOT: /var/lib/devagent/workspaces
      DEVAGENT_SANDBOX_WORKSPACE_VOLUME: devagent-workspaces
      DEVAGENT_SANDBOX_INSTALL_NETWORK: ${DEVAGENT_SANDBOX_INSTALL_NETWORK:-bridge}
      DEVAGENT_SANDBOX_INSTALL_PROXY: ${DEVAGENT_SANDBOX_INSTALL_PROXY:-}
      DEVAGENT_SANDBOX_RUNTIME: ${DEVAGENT_SANDBOX_RUNTIME:-}
    volumes:
      - workspaces:/var/lib/devagent/workspaces
    networks: [default, docker-control]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      docker-proxy: { condition: service_healthy }
      sandbox-image: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-m", "backend.worker", "--check"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  # Builds the sandbox image and exits; the worker starts containers from it.
  sandbox-image:
    build:
      context: .
      dockerfile: docker/sandbox.Dockerfile
      secrets: [extra_ca]
    image: devagent-sandbox:dev
    network_mode: none
    restart: "no"

  # The only service with the Docker socket. Filters every request (sandbox/docker_proxy.py).
  docker-proxy:
    image: devagent-backend:dev
    command: ["python", "-m", "sandbox.docker_proxy"]
    user: "0:0"  # needs the root-owned socket; no capabilities, read-only filesystem
    environment:
      DEVAGENT_PROXY_ALLOWED_IMAGES: '["devagent-sandbox:dev"]'
      DEVAGENT_PROXY_ALLOWED_VOLUMES: '["devagent-workspaces"]'
      DEVAGENT_PROXY_ALLOWED_NETWORKS: '["none", "${DEVAGENT_SANDBOX_INSTALL_NETWORK:-bridge}"]'
      DEVAGENT_PROXY_ALLOWED_RUNTIMES: '["", "runc", "${DEVAGENT_SANDBOX_RUNTIME:-runc}"]'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [docker-control]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate: { condition: service_completed_successfully }  # image is built by migrate
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:2375/_ping', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      secrets: [extra_ca]
    image: devagent-frontend:dev
    environment:
      DEVAGENT_API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

secrets:
  # Optional extra CA bundle for builds behind a TLS-intercepting proxy.
  extra_ca:
    file: ${DEVAGENT_BUILD_CA_FILE:-/dev/null}

volumes:
  postgres-data:
  redis-data:
  workspaces:
    name: devagent-workspaces  # fixed name: the proxy allowlists it and sandboxes mount it

networks:
  default:
  # Worker <-> proxy only. `internal` keeps it off the host's external network.
  docker-control:
    internal: true
